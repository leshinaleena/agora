name: Сбор заметок днём
on:
  schedule:
    # 12:00, 16:00, 20:00 и 0:00 по Афинам (зимой UTC+2). Claude не вызывается, это бесплатно.
    - cron: "7 10 * * *"
    - cron: "7 14 * * *"
    - cron: "7 18 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agora-snapshot
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Взять прежний запас
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-
      - run: python -m bot.snapshot
      - name: Сохранить запас
        uses: actions/cache/save@v4
        with:
          path: cache
          key: feeds-${{ github.run_id }}
