name: Понедельничный выпуск
on:
  schedule:
    # 07:00 UTC = 9:00 по Афинам зимой: после утренней сводки
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать PDF в канал? (yes — да, no — только файл)"
        default: "no"
        required: true
      from_archive:
        description: "Отправить уже проверенный выпуск из архива, без новых запросов к Claude? (yes / no)"
        default: "no"
        required: false
      week:
        description: "Неделя с понедельника (например 2026-11-16); пусто — прошедшая неделя"
        default: ""
        required: false
permissions:
  contents: write
concurrency:
  group: agora
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Собрать выпуск
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PUBLISH: ${{ github.event_name == 'schedule' && vars.PUBLISH_WEEKLY || inputs.publish }}
          WEEK_START: ${{ inputs.week }}
          FROM_ARCHIVE: ${{ inputs.from_archive }}
        run: python -m bot.weekly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly
          path: out/
          if-no-files-found: ignore
      - name: Сохранить в архив
        if: always()
        run: |
          git config user.name "agora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/
          git commit -m "Выпуск $(date -u +%F)" || echo "нечего сохранять"
          git pull --rebase && git push
