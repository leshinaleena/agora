name: Узнать номер чата для уведомлений
# Нажмите Start у бота в Telegram, затем запустите этот сценарий: бот пришлёт вам ваш номер чата.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Прислать пробное уведомление в чат ALERT_CHAT_ID? (yes / no)"
        default: "no"
        required: false
jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: |
          if [ "${{ inputs.test }}" = "yes" ]; then
            echo "Проверка уведомлений: всё работает, это пробное сообщение." > run.log
            python -m bot.alert fail "пробная сводка" run.log
          else
            python -m bot.alert whoami
          fi
