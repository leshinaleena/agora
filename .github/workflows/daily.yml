name: Ежедневная сводка
on:
  schedule:
    # 02:45 UTC = 4:45 по Афинам зимой. Программа соберёт сводку (с запасом на задержки GitHub)
    # и опубликует в 6:30 по Афинам = 7:30 по Москве.
    - cron: "45 2 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать в канал? (yes — да, no — только черновик)"
        default: "no"
        required: true
      replace:
        description: "Удалить прежние посты этой сводки перед отправкой? (yes / no)"
        default: "no"
        required: false
      from_archive:
        description: "Взять готовую сводку из архива за дату (например 2026-11-25), без запросов к Claude"
        default: ""
        required: false
permissions:
  contents: write
concurrency:
  group: agora
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Собрать сводку
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # По расписанию публикует всегда (Лена разрешила 25.11.2026). Выключить: Settings → Variables, PUBLISH_DAILY = no
          PUBLISH: ${{ github.event_name == 'schedule' && (vars.PUBLISH_DAILY || 'yes') || inputs.publish }}
          POST_AT: ${{ github.event_name == 'schedule' && '06:30' || '00:00' }}
          FROM_ARCHIVE: ${{ inputs.from_archive }}
          REPLACE: ${{ inputs.replace }}
        run: python -m bot.daily
      - name: Черновик на страницу запуска
        if: always()
        run: |
          if [ -f out/digest.html ]; then
            { echo "## Сводка"; echo; sed 's/$/<br>/' out/digest.html; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview
          path: out/
          if-no-files-found: ignore
      - name: Сохранить в архив
        run: |
          git config user.name "agora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/
          git commit -m "Сводка $(date -u +%F)" || echo "нечего сохранять"
          git pull --rebase && git push
