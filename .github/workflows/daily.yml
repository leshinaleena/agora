name: Ежедневная сводка
on:
  schedule:
    # 04:50 UTC = 6:50 по Афинам зимой (7:50 летом). Программа соберёт сводку и дождётся 8:30 по Афинам.
    - cron: "50 4 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать в канал? (yes — да, no — только черновик)"
        default: "no"
        required: true
permissions:
  contents: write
concurrency:
  group: agora
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Собрать сводку
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # По расписанию публикует, только если в Settings → Variables задано PUBLISH_DAILY = yes
          PUBLISH: ${{ github.event_name == 'schedule' && vars.PUBLISH_DAILY || inputs.publish }}
          POST_AT: ${{ github.event_name == 'schedule' && '08:30' || '00:00' }}
        run: python -m bot.daily
      - name: Черновик на страницу запуска
        if: always()
        run: |
          if [ -f out/digest.html ]; then
            { echo "## Сводка"; echo; sed 's/$/<br>/' out/digest.html; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview
          path: out/
          if-no-files-found: ignore
      - name: Сохранить в архив
        run: |
          git config user.name "agora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/
          git commit -m "Сводка $(date -u +%F)" || echo "нечего сохранять"
          git push
